name: world-data-importer

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - "tools/WorldDataImporter/**"
      - "tests/WorldDataImporter.Tests/**"
      - ".github/workflows/world-data-importer-ci.yml"
      - "Directory.Build.*"
      - "*.sln"
  pull_request:
    paths:
      - "tools/WorldDataImporter/**"
      - "tests/WorldDataImporter.Tests/**"
      - ".github/workflows/world-data-importer-ci.yml"
      - "Directory.Build.*"
      - "*.sln"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/WorldDataImporter.Tests/WorldDataImporter.Tests.csproj --configuration Release