name: Windows Launcher Release

permissions:
  contents: read

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]
    paths:
      - "tools/launcher/**"
      - "Directory.Build.*"
      - "Athena.NET.sln"
      - "Athena.NET.slnx"
      - ".github/workflows/launcher-release.yml"

jobs:
  build-test-package:
    name: Build, test, and package
    # Only a merged PR into main publishes a release. A closed-but-not-merged
    # PR (declined/abandoned) must not trigger anything below. Manually
    # pushing a tag or pushing directly to main are not triggers at all,
    # since this workflow only listens for pull_request events.
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    env:
      LAUNCHER_PROJECT: tools/launcher/src/Athena.Launcher/Athena.Launcher.csproj
      WATCHDOG_PROJECT: tools/launcher/src/Athena.Launcher.Watchdog/Athena.Launcher.Watchdog.csproj
      CORE_TEST_PROJECT: tools/launcher/tests/Athena.Launcher.Core.Tests/Athena.Launcher.Core.Tests.csproj
      NETWORKING_TEST_PROJECT: tools/launcher/tests/Athena.Launcher.Networking.Tests/Athena.Launcher.Networking.Tests.csproj

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # The PR's merge commit lands on main as a regular commit; check out
          # that resulting main commit (not the PR head) so the release is
          # built from what actually merged.
          ref: main

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "tools/launcher/**/packages.lock.json"

      - name: Derive build version and package name
        id: version
        shell: pwsh
        run: |
          # Use the checked-out main HEAD, not $env:GITHUB_SHA — for a
          # pull_request:closed event GITHUB_SHA is a synthetic merge ref,
          # not necessarily the commit that actually landed on main.
          $shortSha = (git rev-parse HEAD).Substring(0, 7)
          $version = "0.0.0-dev.$env:GITHUB_RUN_NUMBER"
          $numericVersion = "0.0.0"
          $packageFile = "Athena.NET-Launcher-win-x64-$shortSha.zip"
          $releaseName = ""

          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly_version=$numericVersion.0" >> $env:GITHUB_OUTPUT
          "informational_version=$version+$shortSha" >> $env:GITHUB_OUTPUT
          "package_file=$packageFile" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

      # Tests are portable (net10.0, no RuntimeIdentifier) and are never
      # published, so they restore with no RID, matching the RID-less
      # packages.lock.json committed for Athena.Launcher.Core and
      # Athena.Launcher.Networking. Mixing a win-x64 restore into these two
      # projects' shared lock files here would break --locked-mode for the
      # next PR CI run that restores them without a RID (this is the root
      # cause of the original NU1004 failure).
      - name: Restore and test launcher core
        shell: pwsh
        run: |
          dotnet restore $env:CORE_TEST_PROJECT --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test $env:CORE_TEST_PROJECT --configuration Release --logger "trx;LogFileName=launcher-core.trx"

      - name: Restore and test launcher networking
        shell: pwsh
        run: |
          dotnet restore $env:NETWORKING_TEST_PROJECT --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test $env:NETWORKING_TEST_PROJECT --configuration Release --logger "trx;LogFileName=launcher-networking.trx"

      # The publish graph (launcher + watchdog, and transitively Core and
      # Networking) is restored for win-x64 here. This is intentionally NOT
      # --locked-mode: Athena.Launcher.Core/Networking's committed lock files
      # are RID-less (see above), so a --locked-mode win-x64 restore would
      # fail with NU1004 the same way the RID-less test restore would if it
      # saw a win-x64 section. A plain restore still resolves against the
      # exact package versions pinned in the lock file (no version drift),
      # it just also computes the win-x64-specific asset selection that the
      # lock file doesn't need to persist.
      - name: Restore launcher publish graph (win-x64)
        shell: pwsh
        run: |
          dotnet restore $env:LAUNCHER_PROJECT --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $env:WATCHDOG_PROJECT --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build launcher
        shell: pwsh
        run: >-
          dotnet build $env:LAUNCHER_PROJECT
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational_version }}

      - name: Publish self-contained launcher
        shell: pwsh
        run: >-
          dotnet publish $env:LAUNCHER_PROJECT
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish/launcher
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational_version }}

      - name: Publish self-contained watchdog
        shell: pwsh
        run: >-
          dotnet publish $env:WATCHDOG_PROJECT
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish/watchdog
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational_version }}

      - name: Assemble and validate package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD "package/Athena.Launcher"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          Copy-Item "publish/launcher/Athena.Launcher.exe" $packageRoot
          Copy-Item "publish/watchdog/Athena.Launcher.Watchdog.exe" $packageRoot
          Copy-Item "tools/launcher/src/Athena.Launcher/launcher.settings.json" $packageRoot

          $required = @(
            (Join-Path $packageRoot "Athena.Launcher.exe"),
            (Join-Path $packageRoot "Athena.Launcher.Watchdog.exe"),
            (Join-Path $packageRoot "launcher.settings.json")
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required package file is missing: $path"
            }
          }

          $files = @(Get-ChildItem -LiteralPath $packageRoot -File)
          if ($files.Count -ne $required.Count) {
            throw "The package contains unexpected runtime files: $($files.Name -join ', ')"
          }

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "package/Athena.Launcher" -DestinationPath "artifacts/${{ steps.version.outputs.package_file }}" -CompressionLevel Optimal

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $fileName = "${{ steps.version.outputs.package_file }}"
          $zipPath = Join-Path $PWD "artifacts/$fileName"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "$hash  $fileName" | Set-Content -Encoding ascii -NoNewline "$zipPath.sha256"

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athena.NET-Launcher-win-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Derive version, tag, and create GitHub Release
    if: github.event.pull_request.merged == true
    needs: build-test-package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download packaged launcher
        uses: actions/download-artifact@v4
        with:
          name: Athena.NET-Launcher-win-x64
          path: artifacts

      # The version is derived from existing launcher-v* tags reachable on
      # main: bump the patch component of the highest one found. This keeps
      # tag creation automatic and prevents a manually-created tag from being
      # required (or accepted) as the release trigger — the trigger is always
      # "PR merged into main" (see the job-level `if` above), never a tag
      # push, since this workflow only listens for pull_request events.
      - name: Derive next launcher version and tag
        id: release
        shell: pwsh
        run: |
          git fetch --tags --quiet
          $tags = git tag --list 'launcher-v*'
          $latest = $null
          $latestVersion = [Version]"0.0.0"

          foreach ($tag in $tags) {
            if ($tag -match '^launcher-v(?<version>\d+\.\d+\.\d+)$') {
              $candidate = [Version]$Matches.version
              if ($candidate -gt $latestVersion) {
                $latestVersion = $candidate
                $latest = $tag
              }
            }
          }

          $nextVersion = "{0}.{1}.{2}" -f $latestVersion.Major, $latestVersion.Minor, ($latestVersion.Build + 1)
          $tag = "launcher-v$nextVersion"

          "version=$nextVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create launcher tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          # Tag the checked-out main HEAD, not $env:GITHUB_SHA — for a
          # pull_request:closed event GITHUB_SHA is a synthetic merge ref,
          # not necessarily the commit that actually landed on main.
          git tag $tag HEAD
          git push origin $tag

      - name: Rename package for release version
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $zip = Get-ChildItem -Path artifacts -Filter "*.zip" | Select-Object -First 1
          $checksum = Get-ChildItem -Path artifacts -Filter "*.sha256" | Select-Object -First 1

          $newZipName = "Athena.NET-Launcher-v$version-win-x64.zip"
          $newChecksumName = "$newZipName.sha256"

          Move-Item $zip.FullName (Join-Path "artifacts" $newZipName)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path "artifacts" $newZipName)).Hash.ToLowerInvariant()
          "$hash  $newZipName" | Set-Content -Encoding ascii -NoNewline (Join-Path "artifacts" $newChecksumName)
          Remove-Item $checksum.FullName -ErrorAction SilentlyContinue

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $zip = "artifacts/Athena.NET-Launcher-v$version-win-x64.zip"
          $checksum = "$zip.sha256"
          $title = "Athena.NET Launcher v$version"

          gh release create $tag $zip $checksum --title $title --generate-notes --verify-tag
