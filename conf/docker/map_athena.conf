import: ../map_athena.conf

// Docker internal hostname for char-server container.
char_ip: char-server

// The MapServer Docker image bakes in pinned rAthena's db/map_cache.dat at this exact
// repository-relative path (see src/MapServer/Dockerfile) - WORKDIR /app there matches this
// container's own /app working directory, so this is the SAME relative value
// conf/templates/map_athena.conf documents for local `dotnet run`, not a separate Docker-specific
// path. Set explicitly here (not only relying on `import: ../map_athena.conf`) because that
// imported file is a gitignored local developer config that is not guaranteed to exist inside a
// container that only bind-mounts ./conf when docker-compose.override.yml is used - the
// production-style stack (docker-compose.prod.yml, no override) has no other source for this
// setting. MapServerApp refuses to start with generated monster spawns and no real collision
// source configured - see MapServerWorld.RequireRealCollisionSourceIfMobSpawnsExist.

// Athena.NET gameplay ruleset. Athena.NET currently targets the current
// official iRO client (RENEWAL rules only). PreRenewal is NOT implemented -
// selecting it fails MapServer startup. See ai/map-server.md "Gameplay ruleset
// selection" for the composition boundary.
// Values: Renewal (default), PreRenewal (unimplemented - fails startup)
gameplay_ruleset: Renewal
