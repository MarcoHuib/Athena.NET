//--------------------------------------------------------------
// Athena Map-Server Configuration File
//--------------------------------------------------------------

// Note: "Comments" are all text on the right side of a double slash "//"
// Whatever text is commented will not be parsed by the servers, and serves
// only as information/reference.

//--------------------------------------------------------------
//                     Configuration Info
//--------------------------------------------------------------
// Interserver communication credentials are loaded from
// solutionfiles/secrets/secret.json (MapServer.UserId/Password).

// Character Server IP
// The map server connects to the character server using this IP address.
// NOTE: This is useful when you are running behind a firewall or are on
// a machine with multiple interfaces.
//char_ip: 127.0.0.1

// The map server listens on the interface with this IP address.
// NOTE: This allows you to run multiple servers on multiple interfaces
// while using the same ports for each server.
//bind_ip: 127.0.0.1

// Character Server Port
char_port: 6121

// Map Server IP
// The IP address which clients will use to connect.
// Set this to what your server's public IP address is.
//map_ip: 127.0.0.1

// Map Server Port
map_port: 5121

//Time-stamp format which will be printed before all messages.
//Can at most be 20 characters long.
//Common formats:
// %I:%M:%S %p (hour:minute:second 12 hour, AM/PM format)
// %H:%M:%S (hour:minute:second, 24 hour format)
// %d/%b/%Y (day/Month/year)
//For full format information, consult the strftime() manual.
//timestamp_format: [%d/%b %H:%M]

//Makes server log selected message types to a file in the /log/ folder
//1: Log Warning Messages
//2: Log Error and SQL Error messages.
//4: Log Debug Messages
//Example: "console_msg_log: 7" logs all 3 kinds
//Messages logged by this overrides console_silent setting
console_msg_log: 0

// File path to store the console messages above
console_log_filepath: ./log/map-msg_log.log

//Makes server output more silent by omitting certain types of messages:
//1: Hide Information messages
//2: Hide Status messages
//4: Hide Notice Messages
//8: Hide Warning Messages
//16: Hide Error and SQL Error messages.
//32: Hide Debug Messages
//Example: "console_silent: 7" Hides information, status and notice messages (1+2+4)
console_silent: 0

// Athena.NET gameplay ruleset. Athena.NET currently targets the current
// official iRO client (RENEWAL rules only). PreRenewal is NOT implemented -
// selecting it fails MapServer startup. See ai/map-server.md "Gameplay ruleset
// selection" for the composition boundary.
// Values: Renewal (default), PreRenewal (unimplemented - fails startup)
gameplay_ruleset: Renewal

// Map geometry/collision data source (see ai/world-data.md "Map geometry: direct pinned rAthena
// map_cache.dat import"). map_cache_path is the NORMAL/default source: pinned rAthena's own
// db/map_cache.dat, read directly at startup - no installed client, no GRF, no per-map conversion
// step. Every map declared in that file (including int_land/int_land01../04, which the pinned
// file already contains as independent records with real geometry - no alias configuration is
// needed for them) becomes available under its own name.
//
// Format: map_cache_path: <path-to-map_cache.dat>
// Leave unset (the default) to start with no collision data for any map, exactly like today.
//
//map_cache_path: legacy/rathena/db/map_cache.dat

// map_collision_artifact is SECONDARY/debug tooling: a locally supplied Athena collision artifact
// built offline via `WorldDataImporter compile-map-collision` from a LOCAL, gitignored .gat file
// (never commit the .gat or the .athmap it produces), registered under one or more explicit
// logical Athena map names. Unlike map_cache_path, this path IS the place logical-name aliasing
// matters, because a single physical client .gat resource can genuinely back several logical map
// names (e.g. one int_land.gat serving int_land/int_land01../04 client-side).
//
// Format: map_collision_artifact: <path-to-local.athmap>|<map1>,<map2>,...
// This key is repeatable (one line per artifact file).
//
//map_collision_artifact: /local/generated/some_map.athmap|some_map

// map_cache_path and map_collision_artifact are MUTUALLY EXCLUSIVE - configuring both fails
// MapServer startup with a clear error rather than silently picking one.
