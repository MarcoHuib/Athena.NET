//--------------------------------------------------------------
// Athena Map-Server Configuration File
//--------------------------------------------------------------

// Note: "Comments" are all text on the right side of a double slash "//"
// Whatever text is commented will not be parsed by the servers, and serves
// only as information/reference.

//--------------------------------------------------------------
//                     Configuration Info
//--------------------------------------------------------------
// Interserver communication credentials are loaded from
// solutionfiles/secrets/secret.json (MapServer.UserId/Password).

// Character Server IP
// The map server connects to the character server using this IP address.
// NOTE: This is useful when you are running behind a firewall or are on
// a machine with multiple interfaces.
//char_ip: 127.0.0.1

// The map server listens on the interface with this IP address.
// NOTE: This allows you to run multiple servers on multiple interfaces
// while using the same ports for each server.
//bind_ip: 127.0.0.1

// Character Server Port
char_port: 6121

// Map Server IP
// The IP address which clients will use to connect.
// Set this to what your server's public IP address is.
//map_ip: 127.0.0.1

// Map Server Port
map_port: 5121

//Time-stamp format which will be printed before all messages.
//Can at most be 20 characters long.
//Common formats:
// %I:%M:%S %p (hour:minute:second 12 hour, AM/PM format)
// %H:%M:%S (hour:minute:second, 24 hour format)
// %d/%b/%Y (day/Month/year)
//For full format information, consult the strftime() manual.
//timestamp_format: [%d/%b %H:%M]

//Makes server log selected message types to a file in the /log/ folder
//1: Log Warning Messages
//2: Log Error and SQL Error messages.
//4: Log Debug Messages
//Example: "console_msg_log: 7" logs all 3 kinds
//Messages logged by this overrides console_silent setting
console_msg_log: 0

// File path to store the console messages above
console_log_filepath: ./log/map-msg_log.log

//Makes server output more silent by omitting certain types of messages:
//1: Hide Information messages
//2: Hide Status messages
//4: Hide Notice Messages
//8: Hide Warning Messages
//16: Hide Error and SQL Error messages.
//32: Hide Debug Messages
//Example: "console_silent: 7" Hides information, status and notice messages (1+2+4)
console_silent: 0

// Athena.NET gameplay ruleset. Athena.NET currently targets the current
// official iRO client (RENEWAL rules only). PreRenewal is NOT implemented -
// selecting it fails MapServer startup. See ai/map-server.md "Gameplay ruleset
// selection" for the composition boundary.
// Values: Renewal (default), PreRenewal (unimplemented - fails startup)
gameplay_ruleset: Renewal

// Gameplay rates use percentages (100 = 1x, 200 = 2x, 500 = 5x).
//
// Global rates always have a value (100 = 1x when unset) and are the default
// for every reward source. Optional overrides below are commented out by
// default: unset/commented means "inherit the relevant global rate", NOT an
// independent value of its own. When set, an override REPLACES the global for
// its scope - it never stacks/multiplies with it. Example: with base_exp_rate:
// 500 and quest_base_exp_rate commented out, a quest/script EXP reward
// inherits 500 (5x). If quest_base_exp_rate: 1000 were uncommented instead, a
// quest/script reward would use 1000 (10x) directly, NOT 500*1000.
base_exp_rate: 500
job_exp_rate: 500
item_drop_rate: 200

// Optional EXP-rate overrides - uncomment to replace (never combine with) the
// global rate above for that specific reward source.
//quest_base_exp_rate: 1000
//quest_job_exp_rate: 1000
//mvp_base_exp_rate: 100
//mvp_job_exp_rate: 100

// Optional drop-rate overrides - uncomment to replace (never combine with)
// item_drop_rate for that specific drop source. Tutorial quest-specific
// Wood/Lumber QuestDropRule awards are unaffected by any of these - drop
// rate is a chance/probability multiplier, never an item-count multiplier,
// and this repository's only real drop consumer never crosses 100% chance
// regardless of these settings.
//card_drop_rate: 100
//boss_item_drop_rate: 200
//mvp_item_drop_rate: 500
//quest_item_drop_rate: 10000

// Drop-rate resolution uses the most specific configured override: exact
// source+category -> source-level -> generic category -> global
// item_drop_rate. Each configured value REPLACES the fallback below it;
// rates never stack. Card is currently the only category with a generic
// override (card_drop_rate above); Common/Heal/Use/Equip fall straight from
// their source-level override to the global. Example: item_drop_rate: 200,
// card_drop_rate: 100, boss_item_drop_rate: 300, item_rate_card_boss unset
// => Boss Card resolves to 300 (source-level beats generic category and
// global). If item_rate_card_boss: 50 were also set, Boss Card would
// resolve to 50 instead (exact source+category wins over everything else).
//
// Optional rAthena-style item-category overrides (normal drop-table items,
// categorized by item type). Each inherits the source-level override (or
// the generic category/global fallback above) unless set explicitly here.
//item_rate_common: 200
//item_rate_heal: 200
//item_rate_use: 200
//item_rate_equip: 200
//item_rate_card: 100
//item_rate_common_boss: 200
//item_rate_heal_boss: 200
//item_rate_use_boss: 200
//item_rate_equip_boss: 200
//item_rate_card_boss: 200
//item_rate_common_mvp: 200
//item_rate_heal_mvp: 200
//item_rate_use_mvp: 200
//item_rate_equip_mvp: 200
//item_rate_card_mvp: 200

// Direct-reward MVP item rate - the MVP's own reward item, distinct from the
// item_rate_*_mvp family above (normal drop-table items dropped BY an MVP).
// Falls back to mvp_item_drop_rate, then the global, when unset.
//item_rate_mvp: 200

// Map geometry/collision data source (see ai/world-data.md "Map geometry: direct pinned rAthena
// map_cache.dat import"). map_cache_path is the NORMAL/default source: pinned rAthena's own
// db/map_cache.dat, read directly at startup - no installed client, no GRF, no per-map conversion
// step. Every map declared in that file (including int_land/int_land01../04, which the pinned
// file already contains as independent records with real geometry - no alias configuration is
// needed for them) becomes available under its own name.
//
// Format: map_cache_path: <path-to-map_cache.dat>
// Enabled by default: MapServer now has generated monster spawn declarations (G_PORING), and the
// production composition root (MapServerApp.RunAsync) refuses to start with generated monster
// spawns but no real collision source configured, rather than silently placing monsters on
// UnverifiedFallbackMobSpawnCellSelector's fabricated placeholder coordinates - see
// MapServerWorld.RequireRealCollisionSourceIfMobSpawnsExist's own doc comment. The path below is
// repository-relative and resolves correctly for local `dotnet run` from the repo root, inside the
// MapServer Docker image (which bakes in the exact same legacy/rathena/db/map_cache.dat at build
// time - see src/MapServer/Dockerfile), and in CI (which checks out the pinned submodule) alike -
// no separate absolute-path branch is needed. Leave commented out only for a deliberately
// collision-less/dev setup with no generated monster spawns; MapServerApp will refuse to start
// otherwise once generated monsters exist.
map_cache_path: legacy/rathena/db/map_cache.dat

// map_collision_artifact is SECONDARY/debug tooling: a locally supplied Athena collision artifact
// built offline via `WorldDataImporter compile-map-collision` from a LOCAL, gitignored .gat file
// (never commit the .gat or the .athmap it produces), registered under one or more explicit
// logical Athena map names. Unlike map_cache_path, this path IS the place logical-name aliasing
// matters, because a single physical client .gat resource can genuinely back several logical map
// names (e.g. one int_land.gat serving int_land/int_land01../04 client-side).
//
// Format: map_collision_artifact: <path-to-local.athmap>|<map1>,<map2>,...
// This key is repeatable (one line per artifact file).
//
//map_collision_artifact: /local/generated/some_map.athmap|some_map

// map_cache_path and map_collision_artifact are MUTUALLY EXCLUSIVE - configuring both fails
// MapServer startup with a clear error rather than silently picking one.
